<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- {'id': 1, 'title': '출석 인증', 'content': '출석 인증합니다.'} -->

    <p>{{ post['content'] }}</p>

    <a href="/posts/{{ post['id'] }}/edit">수정하기</a>

        <input type="submit" value="삭제하기">
    </form>
